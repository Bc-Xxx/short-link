<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短链接服务</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        /* ===== 全局变量 ===== */
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
            --transition: 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8ecf8 100%);
            min-height: 100vh;
            color: var(--gray-800);
        }

        /* ===== 通用组件 ===== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 20px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: var(--transition); text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; color: var(--gray-600); border: 1px solid var(--gray-300); }
        .btn-outline:hover { background: var(--gray-50); border-color: var(--gray-400); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }

        .card {
            background: #fff; border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 24px;
        }

        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 500;
        }
        .badge-safe { background: #d1fae5; color: #065f46; }
        .badge-warn { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: var(--gray-100); color: var(--gray-500); }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            padding: 14px 20px; border-radius: var(--radius-sm);
            color: #fff; font-size: 14px; font-weight: 500;
            box-shadow: var(--shadow-lg); transform: translateX(120%);
            transition: transform 0.3s ease; max-width: 360px;
        }
        .toast.show { transform: translateX(0); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: var(--primary); }

        input[type="text"], input[type="password"], input[type="email"], input[type="url"] {
            width: 100%; padding: 10px 14px; border: 1px solid var(--gray-300);
            border-radius: var(--radius-sm); font-size: 14px; outline: none;
            transition: var(--transition);
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

        .loading {
            display: inline-block; width: 18px; height: 18px;
            border: 2px solid var(--gray-300); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center; padding: 48px 20px; color: var(--gray-400);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        /* ===== 登录页 ===== */
        #auth-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .auth-box {
            width: 100%; max-width: 420px; background: #fff;
            border-radius: var(--radius); box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .auth-header {
            padding: 32px 32px 0; text-align: center;
        }
        .auth-header .logo {
            font-size: 32px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-header p { color: var(--gray-500); font-size: 14px; margin-top: 4px; }
        .auth-tabs {
            display: flex; margin: 24px 32px 0; border-bottom: 2px solid var(--gray-100);
        }
        .auth-tab {
            flex: 1; padding: 12px; text-align: center; cursor: pointer;
            color: var(--gray-400); font-weight: 500; font-size: 14px;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            transition: var(--transition);
        }
        .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .auth-tab:hover { color: var(--gray-600); }

        .auth-form { padding: 24px 32px 32px; }
        .auth-form .field { margin-bottom: 16px; }
        .auth-form label { display: block; font-size: 13px; font-weight: 500; color: var(--gray-700); margin-bottom: 4px; }
        .auth-form .btn { width: 100%; justify-content: center; padding: 12px; font-size: 15px; margin-top: 8px; }
        .auth-form .error { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; }
        .auth-form .switch-text { text-align: center; font-size: 13px; color: var(--gray-500); margin-top: 16px; }
        .auth-form .switch-text a { color: var(--primary); cursor: pointer; text-decoration: none; font-weight: 500; }

        /* ===== 主页面 ===== */
        #app-page { display: none; }
        .topbar {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 100;
        }
        .topbar-inner {
            max-width: 960px; margin: 0 auto; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar .logo { font-size: 20px; font-weight: 700; color: var(--primary); }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .topbar-right .user-name { font-size: 14px; color: var(--gray-600); }
        .topbar-right .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
        }

        .main-content { padding: 24px 0 40px; }

        /* 创建链接区 */
        .create-section .card { display: flex; gap: 12px; padding: 16px 20px; align-items: center; }
        .create-section .card input { flex: 1; }
        .create-section .card .btn { white-space: nowrap; padding: 10px 24px; }
        .create-section .result-box {
            margin-top: 12px; padding: 14px 18px;
            background: var(--primary-light); border-radius: var(--radius-sm);
            display: none; align-items: center; gap: 12px;
        }
        .create-section .result-box.show { display: flex; }
        .create-section .result-box .short-url { font-weight: 600; color: var(--primary); flex: 1; }
        .create-section .result-box .copy-btn { cursor: pointer; color: var(--gray-500); font-size: 13px; }
        .create-section .result-box .copy-btn:hover { color: var(--primary); }

        /* 链接列表 */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin: 28px 0 16px;
        }
        .section-header h2 { font-size: 18px; font-weight: 600; }
        .section-header .count { color: var(--gray-400); font-size: 14px; font-weight: 400; }

        .link-table { width: 100%; }
        .link-table th {
            text-align: left; padding: 10px 16px; font-size: 12px;
            font-weight: 600; color: var(--gray-500); text-transform: uppercase;
            border-bottom: 1px solid var(--gray-200);
        }
        .link-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--gray-100); }
        .link-table tr:hover td { background: var(--gray-50); }
        .link-table .short-url-cell { font-weight: 500; color: var(--primary); cursor: pointer; }
        .link-table .short-url-cell:hover { text-decoration: underline; }
        .link-table .orig-url {
            max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--gray-500);
        }
        .link-table .clicks-cell { font-weight: 500; color: var(--gray-700); }
        .link-table .actions { display: flex; gap: 6px; }
        .link-table .actions .btn { padding: 4px 10px; font-size: 12px; }

        /* 详情页 */
        #detail-view { display: none; }
        .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .detail-header h2 { font-size: 20px; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .detail-grid .card { padding: 20px; }
        .detail-grid .card-full { grid-column: 1 / -1; }
        .detail-grid .card h3 { font-size: 14px; color: var(--gray-500); margin-bottom: 8px; font-weight: 500; }
        .detail-grid .card .value { font-size: 24px; font-weight: 700; color: var(--gray-800); }
        .detail-grid .card .value.large { font-size: 36px; }
        .detail-grid .card .desc { font-size: 13px; color: var(--gray-400); margin-top: 4px; }
        .detail-url { word-break: break-all; font-size: 14px; color: var(--primary); }
        .detail-url a { color: var(--primary); text-decoration: none; }
        .detail-url a:hover { text-decoration: underline; }

        .safety-card { display: flex; align-items: center; gap: 16px; }
        .safety-card .score-circle {
            width: 64px; height: 64px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0;
        }
        .safety-card .score-circle.high { background: var(--success); }
        .safety-card .score-circle.medium { background: var(--warning); }
        .safety-card .score-circle.low { background: var(--danger); }
        .safety-card .score-circle.none { background: var(--gray-300); color: var(--gray-500); }
        .safety-card .info { flex: 1; }
        .safety-card .info .level { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .safety-card .info .reason { font-size: 13px; color: var(--gray-500); line-height: 1.5; }

        .chart-container { height: 200px; margin-top: 12px; }

        /* 响应式 */
        @media (max-width: 640px) {
            .detail-grid { grid-template-columns: 1fr; }
            .create-section .card { flex-direction: column; }
            .create-section .card .btn { width: 100%; }
            .link-table .orig-url { max-width: 120px; }
            .topbar-inner { padding: 12px 16px; }
            .auth-form { padding: 24px 20px 28px; }
            .auth-tabs { margin-left: 20px; margin-right: 20px; }
            .auth-header { padding: 28px 20px 0; }
        }
    </style>
</head>
<body>

    <!-- ===== Toast 通知 ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== 登录/注册页 ===== -->
    <div id="auth-page">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">🔗 短链接</div>
                <p>安全 · 快速 · 可追踪</p>
            </div>
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">登录</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">注册</div>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" class="auth-form" onsubmit="login(event)">
                <div class="field">
                    <label>用户名</label>
                    <input type="text" id="login-username" placeholder="输入用户名" required>
                </div>
                <div class="field">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登 录</button>
                <div id="login-error" class="error"></div>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="auth-form" style="display:none" onsubmit="register(event)">
                <div class="field">
                    <label>用户名</label>
                    <input type="text" id="reg-username" placeholder="设置用户名" required>
                </div>
                <div class="field">
                    <label>邮箱</label>
                    <input type="email" id="reg-email" placeholder="输入邮箱" required>
                </div>
                <div class="field">
                    <label>密码</label>
                    <input type="password" id="reg-password" placeholder="设置密码" required>
                </div>
                <button type="submit" class="btn btn-primary">注 册</button>
                <div id="reg-error" class="error"></div>
                <div class="switch-text">已有账号？<a onclick="switchAuthTab('login')">去登录</a></div>
            </form>
        </div>
    </div>

    <!-- ===== 主页面 ===== -->
    <div id="app-page">
        <div class="topbar">
            <div class="topbar-inner">
                <div class="logo">🔗 短链接</div>
                <div class="topbar-right">
                    <span class="user-name" id="user-name"></span>
                    <div class="avatar" id="user-avatar"></div>
                    <button class="btn btn-outline btn-sm" onclick="logout()">退出</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="container">

                <!-- 创建链接 -->
                <div class="create-section">
                    <div class="card">
                        <input type="url" id="create-url" placeholder="粘贴长链接，例如 https://example.com/very/long/url" required>
                        <button class="btn btn-primary" onclick="createLink()" id="create-btn">
                            <span id="create-btn-text">生成短链接</span>
                            <span id="create-btn-loading" class="loading" style="display:none"></span>
                        </button>
                    </div>
                    <div class="result-box" id="result-box">
                        <span>✅ 已生成：</span>
                        <span class="short-url" id="result-url"></span>
                        <span class="copy-btn" onclick="copyResult()">📋 复制</span>
                    </div>
                </div>

                <!-- 列表标题 -->
                <div class="section-header">
                    <h2>我的链接 <span class="count" id="link-count"></span></h2>
                </div>

                <!-- 链接列表 -->
                <div class="card" id="link-list">
                    <div class="loading" style="display:block;margin:32px auto"></div>
                </div>

                <!-- 详情视图 -->
                <div id="detail-view">
                    <div class="detail-header">
                        <button class="btn btn-outline btn-sm" onclick="showList()">← 返回</button>
                        <h2>链接详情</h2>
                    </div>
                    <div class="detail-grid" id="detail-content"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ===== 状态 =====
        let TOKEN = localStorage.getItem('token') || '';
        let USER = JSON.parse(localStorage.getItem('user') || '{}');
        let currentChart = null;

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            if (TOKEN && USER.username) {
                showApp();
                loadLinks();
            }
        });

        // ===== Toast =====
        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast toast-' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ===== 登录注册切换 =====
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.style.display = 'none');
            document.getElementById('login-error').textContent = '';
            document.getElementById('reg-error').textContent = '';
            if (tab === 'login') {
                document.querySelector('.auth-tab:first-child').classList.add('active');
                document.getElementById('login-form').style.display = 'block';
            } else {
                document.querySelector('.auth-tab:last-child').classList.add('active');
                document.getElementById('register-form').style.display = 'block';
            }
        }

        // ===== API 请求 =====
        async function api(method, path, body = null) {
            const opts = {
                method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(path, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || '请求失败');
            return data;
        }

        // ===== 登录 =====
        async function login(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true; btn.textContent = '登录中...';
            document.getElementById('login-error').textContent = '';
            try {
                const data = await api('POST', '/auth/login', {
                    username: document.getElementById('login-username').value,
                    password: document.getElementById('login-password').value,
                });
                TOKEN = data.access_token;
                localStorage.setItem('token', TOKEN);
                // 获取用户信息
                const links = await api('GET', '/links');
                USER = { username: document.getElementById('login-username').value };
                localStorage.setItem('user', JSON.stringify(USER));
                showApp();
                loadLinks();
                showToast('登录成功', 'success');
            } catch (err) {
                document.getElementById('login-error').textContent = err.message;
            } finally {
                btn.disabled = false; btn.textContent = '登 录';
            }
        }

        // ===== 注册 =====
        async function register(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true; btn.textContent = '注册中...';
            document.getElementById('reg-error').textContent = '';
            try {
                await api('POST', '/auth/register', {
                    username: document.getElementById('reg-username').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value,
                });
                showToast('注册成功，请登录', 'success');
                switchAuthTab('login');
                document.getElementById('login-username').value = document.getElementById('reg-username').value;
            } catch (err) {
                document.getElementById('reg-error').textContent = err.message;
            } finally {
                btn.disabled = false; btn.textContent = '注 册';
            }
        }

        // ===== 页面切换 =====
        function showApp() {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('app-page').style.display = 'block';
            document.getElementById('user-name').textContent = USER.username || '';
            document.getElementById('user-avatar').textContent = (USER.username || 'U')[0].toUpperCase();
        }

        function showList() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('link-list').style.display = 'block';
            document.querySelector('.section-header').style.display = 'flex';
            document.querySelector('.create-section').style.display = 'block';
        }

        // ===== 退出 =====
        function logout() {
            TOKEN = '';
            USER = {};
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            document.getElementById('auth-page').style.display = 'flex';
            document.getElementById('app-page').style.display = 'none';
            showToast('已退出', 'info');
        }

        // ===== 创建短链接 =====
        async function createLink() {
            const url = document.getElementById('create-url').value.trim();
            if (!url) { showToast('请输入链接', 'error'); return; }
            const btn = document.getElementById('create-btn');
            btn.disabled = true;
            document.getElementById('create-btn-text').style.display = 'none';
            document.getElementById('create-btn-loading').style.display = 'inline-block';
            try {
                const data = await api('POST', '/links', { original_url: url });
                const box = document.getElementById('result-box');
                document.getElementById('result-url').textContent = data.short_url;
                // 用当前 host 替换
                const currentBase = window.location.origin;
                document.getElementById('result-url').textContent = currentBase + '/' + data.short_code;
                box.classList.add('show');
                document.getElementById('create-url').value = '';
                showToast('短链接已生成！', 'success');
                loadLinks();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                document.getElementById('create-btn-text').style.display = 'inline';
                document.getElementById('create-btn-loading').style.display = 'none';
            }
        }

        // ===== 复制短链接 =====
        function copyResult() {
            const text = document.getElementById('result-url').textContent;
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制到剪贴板', 'success');
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast('已复制到剪贴板', 'success');
            });
        }

        // ===== 加载链接列表 =====
        async function loadLinks() {
            const el = document.getElementById('link-list');
            try {
                const data = await api('GET', '/links?skip=0&limit=50');
                const links = data.links || [];
                document.getElementById('link-count').textContent = `(${links.length})`;

                if (links.length === 0) {
                    el.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🔗</div>
                            <p>还没有短链接，在上方输入框粘贴链接开始创建吧</p>
                        </div>
                    `;
                    return;
                }

                el.innerHTML = `
                    <table class="link-table">
                        <thead><tr>
                            <th>短链接</th>
                            <th>原始链接</th>
                            <th>访问</th>
                            <th>安全</th>
                            <th>操作</th>
                        </tr></thead>
                        <tbody>${links.map((link, i) => `
                            <tr>
                                <td class="short-url-cell" onclick="showDetail(${link.id})">
                                    ${window.location.origin}/${link.short_code}
                                </td>
                                <td class="orig-url" title="${link.original_url}">${link.original_url}</td>
                                <td class="clicks-cell">${link.click_count || 0}</td>
                                <td>${safetyBadge(link.safety_level, link.safety_score)}</td>
                                <td class="actions">
                                    <button class="btn btn-outline btn-sm" onclick="showDetail(${link.id})">详情</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteLink(${link.id})">删除</button>
                                </td>
                            </tr>
                        `).join('')}</tbody>
                    </table>
                `;
            } catch (err) {
                el.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">加载失败：${err.message}</p></div>`;
            }
        }

        function safetyBadge(level, score) {
            if (!level || level === '待分析' || level === '未配置API') return '<span class="badge badge-pending">待分析</span>';
            if (level === '安全') return `<span class="badge badge-safe">${level} ${score||''}</span>`;
            if (level === '警告') return `<span class="badge badge-warn">${level} ${score||''}</span>`;
            if (level === '危险') return `<span class="badge badge-danger">${level} ${score||''}</span>`;
            return '<span class="badge badge-pending">' + level + '</span>';
        }

        // ===== 删除链接 =====
        async function deleteLink(id) {
            if (!confirm('确定删除这个短链接吗？')) return;
            try {
                await api('DELETE', '/links/' + id);
                showToast('删除成功', 'success');
                loadLinks();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ===== 查看详情 =====
        async function showDetail(id) {
            document.getElementById('link-list').style.display = 'none';
            document.querySelector('.section-header').style.display = 'none';
            document.querySelector('.create-section').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            const el = document.getElementById('detail-content');

            try {
                const [link, stats] = await Promise.all([
                    api('GET', '/links/' + id),
                    api('GET', '/links/' + id + '/stats').catch(() => null)
                ]);

                const s = stats || { total_clicks: 0, today_clicks: 0, daily_stats: [] };
                const currentBase = window.location.origin;
                const shortUrl = currentBase + '/' + link.short_code;

                el.innerHTML = `
                    <div class="card card-full">
                        <h3>短链接</h3>
                        <div class="detail-url"><a href="${shortUrl}" target="_blank">${shortUrl}</a> <span style="font-size:12px;color:var(--gray-400)">(点击可访问)</span></div>
                    </div>
                    <div class="card card-full">
                        <h3>原始链接</h3>
                        <div class="detail-url"><a href="${link.original_url}" target="_blank">${link.original_url}</a></div>
                    </div>
                    <div class="card">
                        <h3>总访问量</h3>
                        <div class="value large">${s.total_clicks}</div>
                        <div class="desc">累计点击次数</div>
                    </div>
                    <div class="card">
                        <h3>今日访问</h3>
                        <div class="value large">${s.today_clicks}</div>
                        <div class="desc">${new Date().toLocaleDateString('zh-CN')}</div>
                    </div>
                    <div class="card card-full">
                        <h3>安全分析</h3>
                        <div class="safety-card">
                            ${safetyCircle(link.safety_level, link.safety_score)}
                            <div class="info">
                                <div class="level">${link.safety_level || '待分析'}</div>
                                <div class="reason">${link.safety_reason || (link.safety_level === '待分析' ? 'AI分析正在进行中，请稍后刷新查看' : '暂无分析结果')}</div>
                            </div>
                        </div>
                    </div>
                    <div class="card card-full">
                        <h3>近7天访问趋势</h3>
                        <div class="chart-container">
                            <canvas id="daily-chart"></canvas>
                        </div>
                    </div>
                `;

                // 画图
                if (s.daily_stats && s.daily_stats.length > 0) {
                    renderChart(s.daily_stats);
                }

            } catch (err) {
                el.innerHTML = `<div class="card card-full"><p style="color:var(--danger)">加载失败：${err.message}</p></div>`;
            }
        }

        function safetyCircle(level, score) {
            const cls = !level || level === '待分析' ? 'none'
                : level === '安全' ? 'high'
                : level === '警告' ? 'medium'
                : level === '危险' ? 'low' : 'none';
            const displayScore = score != null ? score : '--';
            return `<div class="score-circle ${cls}">${displayScore}</div>`;
        }

        function renderChart(dailyStats) {
            if (currentChart) { currentChart.destroy(); }
            const ctx = document.getElementById('daily-chart').getContext('2d');
            const labels = dailyStats.map(d => d.date.slice(5)); // MM-DD
            const values = dailyStats.map(d => d.count);

            currentChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '访问次数',
                        data: values,
                        backgroundColor: 'rgba(99, 102, 241, 0.7)',
                        borderColor: 'rgba(99, 102, 241, 1)',
                        borderWidth: 1,
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, color: '#9ca3af' },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            ticks: { color: '#9ca3af' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
